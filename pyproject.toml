[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-v3"
version = "3.0.0"
description = "L.Y.R.A v3 - Your Intelligent Robot Assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
llm-groq = ["groq>=0.10"]
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.30"]
audio = ["livekit>=1.5", "livekit-agents>=0.8", "silero-vad>=5.0", "faster-whisper>=1.0", "elevenlabs>=1.0"]
vision = ["ultralytics>=8.0", "mediapipe>=0.10"]
telegram = ["python-telegram-bot>=21.0"]
google = ["google-api-python-client>=2.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "aiofiles>=24.0"]
cli = ["prompt-toolkit>=3.0", "pygments>=2.18"]
memory = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
mcp = ["mcp>=1.0"]
all = ["lyra-v3[llm-groq,llm-anthropic,llm-openai,audio,vision,telegram,google,web,cli,memory,mcp]"]

[project.scripts]
lyra = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
